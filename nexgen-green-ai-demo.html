<style>
:root{--bg:#fff;--side:#f6f6f7;--hover:#e9e9ed;--line:#e3e3e8;--text:#1b1b20;--mute:#71717c;--acc:#0e9f6e;--ubub:#efeff2;--comp:#f3f3f6;--code:#14171c;--glow:#0e9f6e22;

:root[data-theme="dark"]{--bg:#0e0f11;--side:#141517;--hover:#25272b;--line:#2a2c31;--text:#ececf0;--mute:#9b9ba7;--acc:#2ecf98;--ubub:#26282d;--comp:#1d1f23;--code:#08090a;--glow:#14b8a638}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Bengali",system-ui,sans-serif}
button,textarea,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}textarea{resize:none}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;height:100%}
.side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;transition:margin .2s}

.logo{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;font-weight:600}
.lg{display:flex;gap:10px;align-items:center}

.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;font-size:.92rem;text-align:left}
.nv:hover,.hi:hover,.ib:hover{background:var(--hover)}.nv.pri{background:var(--hover)}
.srch{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px}

.hi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hi.on{background:var(--hover)}

.none{padding:6px 10px;font-size:.88rem;color:var(--mute)}

.upb{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.8rem}.upb:hover{background:var(--hover)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;min-height:58px;position:relative;z-index:2}
.tl,.tr{display:flex;align-items:center;gap:6px;min-width:90px}.tr{justify-content:flex-end}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--mute)}
.seg{display:flex;background:var(--comp);border-radius:999px;padding:3px}
.seg button{padding:7px 20px;border-radius:999px;font-weight:500;font-size:.88rem;color:var(--mute)}
.seg button.on{background:var(--hover);color:var(--text)}
.lang{width:auto;padding:0 10px;font-size:.82rem;font-weight:500}
.upg{color:var(--acc);font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:10px;display:flex;gap:6px;align-items:center}.upg:hover{background:var(--hover)}
.sun{display:none}[data-theme="dark"] .sun{display:block}[data-theme="dark"] .moon{display:none}
.scroll{flex:1;overflow-y:auto;position:relative}
.main.empty .scroll{display:flex;flex-direction:column;justify-content:center;background:radial-gradient(ellipse 60% 45% at 50% 55%,var(--glow),transparent 70%)}
.col{max-width:780px;width:100%;margin:0 auto;padding:0 18px}
.hero{text-align:center;display:none;margin-bottom:26px}.main.empty .hero{display:block}
.hero h1{font-size:clamp(1.6rem,4vw,2.15rem);font-weight:500;margin:0;letter-spacing:-.02em}
.plan{display:inline-block;margin-bottom:22px;font-size:.84rem;color:var(--mute);background:var(--comp);padding:7px 14px;border-radius:12px}

.chips{display:none;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}.main.empty .chips{display:flex}
.chip{padding:9px 16px;border:1px solid var(--line);border-radius:999px;font-size:.88rem;color:var(--mute)}.chip:hover{background:var(--hover);color:var(--text)}

.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex-shrink:0;margin-top:2px}.av svg{width:16px;height:16px}
.body{min-width:0;line-height:1.75}
.user .body{background:var(--ubub);padding:10px 18px;border-radius:22px;max-width:80%;white-space:pre-wrap;word-break:break-word}
.body p{margin:.6em 0}.body p:first-child{margin-top:0}.body h2{font-size:1.1rem;margin:1em 0 .4em}
.body ul,.body ol{padding-left:1.4em;margin:.6em 0}.body li{margin:.25em 0}
.body code{font-family:"JetBrains Mono",monospace;font-size:.85em;background:var(--hover);padding:.15em .4em;border-radius:6px}
.body pre{margin:1em 0;background:var(--code);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#ffffff12;color:#b8bcc6;font-size:.78rem}
.ch button{display:flex;gap:6px;align-items:center;color:#b8bcc6;padding:4px 8px;border-radius:6px;font-size:.78rem}.ch button:hover{background:#ffffff1a}
.body pre code{display:block;background:none;color:#e6e9ef;padding:14px;overflow:auto;white-space:pre;font-size:.85rem}
.acts{display:flex;gap:2px;margin-top:6px;margin-left:-8px}.acts .ib{width:32px;height:32px}.acts .ib.on{color:var(--acc)}
.ty{display:inline-flex;gap:5px;padding:10px 0}.ty span{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:b 1.1s infinite}
.ty span:nth-child(2){animation-delay:.15s}.ty span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.th{font-size:.82rem;color:var(--mute);margin-bottom:8px}
.cw{padding:6px 18px 12px}.main.empty .cw{display:none}
.comp{max-width:780px;margin:0 auto;background:var(--comp);border:1px solid var(--line);border-radius:28px;padding:12px 12px 10px 16px}
.comp:focus-within{border-color:var(--mute)}
.comp textarea{display:block;width:100%;background:none;border:0;outline:0;padding:4px 4px 8px;line-height:1.55;max-height:200px;min-height:30px}
.comp textarea::placeholder{color:var(--mute)}
.cr{display:flex;align-items:center;gap:6px}
.cr .ib{width:34px;height:34px;border-radius:50%}
.tk{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.88rem;color:var(--mute)}.tk:hover{background:var(--hover)}.tk.on{color:var(--acc);background:var(--hover)}
.mdl{margin-left:auto;font-size:.82rem;color:var(--mute);padding:0 6px}
.sb{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex-shrink:0}.sb:disabled{opacity:.35;cursor:not-allowed}
.file{display:none;margin:0 0 8px;font-size:.82rem;color:var(--mute)}.file.on{display:inline-flex;gap:8px;align-items:center;background:var(--hover);padding:5px 10px;border-radius:10px}
.note{text-align:center;font-size:.74rem;color:var(--mute);margin-top:9px}
.slot{width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scrim{display:none}
@media (max-width:860px){
.side{position:fixed;inset:0 auto 0 0;z-index:40;margin-left:-290px;width:272px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.side.show{margin-left:0}.side.hide{margin-left:-290px}
.scrim.show{display:block;position:fixed;inset:0;background:#0007;z-index:35}
.seg button{padding:7px 14px}.upg span{display:none}.user .body{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const reply=q=>{for(const [re,a] of R)if(re.test(q))return a[L];return FB[L](q)};
const ico={cp:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',up:'<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9ZM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2l-1.5 7a2 2 0 0 1-2 1.5H7"/></svg>',dn:'<svg viewBox="0 0 24 24"><path d="M17 13V4h3v9ZM17 13l-4 8a2 2 0 0 1-2-2v-4H5a2 2 0 0 1-2-2l1.5-7a2 2 0 0 1 2-1.5H17"/></svg>',rg:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.3-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.3 6.3L3 16M3 21v-5h5"/></svg>',st:'<svg viewBox="0 0 24 24"><path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 4H7l3-4Z"/></svg>'};
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('on'),1800)}
function md(s0){
 const bl=[];let s=esc(s0).replace(/```(\w+)?\n([\s\S]*?)(```|$)/g,(_,l,c)=>{bl.push('<pre><div class="ch"><span>'+(l||'code')+'</span><button data-cc>'+ico.cp+t('copy')+'</button></div><code>'+c.trim()+'</code></pre>');return '\u0001'+(bl.length-1)+'\u0001'});
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
 const o=[];let lt=null,p=[];const fp=()=>{if(p.length){o.push('<p>'+p.join('<br>')+'</p>');p=[]}},fl=()=>{if(lt){o.push('</'+lt+'>');lt=null}};
 for(const ln of s.split('\n')){let m;
  if(/^\u0001\d+\u0001$/.test(ln)){fp();fl();o.push(ln)}
  else if(m=ln.match(/^#{1,3}\s+(.*)/)){fp();fl();o.push('<h2>'+m[1]+'</h2>')}
  else if(m=ln.match(/^[-*]\s+(.*)/)){fp();if(lt!=='ul'){fl();o.push('<ul>');lt='ul'}o.push('<li>'+m[1]+'</li>')}
  else if(m=ln.match(/^\d+\.\s+(.*)/)){fp();if(lt!=='ol'){fl();o.push('<ol>');lt='ol'}o.push('<li>'+m[1]+'</li>')}
  else if(!ln.trim()){fp();fl()}else{fl();p.push(ln)}}
 fp();fl();return o.join('').replace(/\u0001(\d+)\u0001/g,(_,i)=>bl[i]);
}
function applyLang(){
 document.documentElement.lang=L;$('lang').textContent=L==='en'?'বাংলা':'EN';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('inp').placeholder=t('ph');
 $('chips').innerHTML='';CH[L].forEach(([a,b])=>{const c=document.createElement('button');c.className='chip';c.textContent=a;c.onclick=()=>send(b);$('chips').appendChild(c)});
 render();
}
function msgEl(m,i){
 const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'ai');
 const b=document.createElement('div');b.className='body';
 if(m.role==='user'){b.textContent=m.text;d.appendChild(b);return d}
 const av=document.createElement('div');av.className='av';av.innerHTML=ico.st;d.appendChild(av);
 b.innerHTML=(m.think&&m.text?'<div class="th">'+t('thought')+'</div>':'')+(m.text?md(m.text):'<div class="ty"><span></span><span></span><span></span></div>');
 const w=document.createElement('div');w.style.cssText='flex:1;min-width:0';w.appendChild(b);
 if(m.text&&!m.live){
  const a=document.createElement('div');a.className='acts';
  a.innerHTML='<button class="ib">'+ico.cp+'</button><button class="ib'+(m.fb==='up'?' on':'')+'">'+ico.up+'</button><button class="ib'+(m.fb==='dn'?' on':'')+'">'+ico.dn+'</button><button class="ib">'+ico.rg+'</button>';
  const [c,u,n,r]=a.children;
  c.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(m.text).catch(()=>{});toast(t('copied'))};
  u.onclick=()=>{m.fb=m.fb==='up'?'':'up';render()};n.onclick=()=>{m.fb=m.fb==='dn'?'':'dn';render()};r.onclick=()=>regen(i);
  w.appendChild(a);
 }
 d.appendChild(w);return d;
}
function histBtn(c){
 const b=document.createElement('div');b.className='hi'+(c===cur?' on':'');b.tabIndex=0;b.setAttribute('role','button');
 b.innerHTML='<span></span><button class="pn" aria-label="Pin">'+ico.pin+'</button>';b.firstChild.textContent=c.title;
 b.onclick=()=>{if(busy)return;cur=c;render();closeSide()};
 b.onkeydown=e=>{if(e.key==='Enter')b.onclick()};
 b.querySelector('.pn').onclick=e=>{e.stopPropagation();c.pin=!c.pin;render()};return b;
}
function render(){
 const em=!cur.msgs.length;$('main').classList.toggle('empty',em);
 $('compWrap').firstElementChild;
 const slot=em?$('heroSlot'):$('footSlot');if($('comp').parentNode!==slot)slot.appendChild($('comp'));
 $('msgs').innerHTML='';cur.msgs.forEach((m,i)=>$('msgs').appendChild(msgEl(m,i)));
 const list=chats.filter(c=>c.msgs.length&&c.title.toLowerCase().includes(filter));
 const h=$('hist');h.innerHTML='';
 const grp=(lab,arr)=>{if(!arr.length&&lab!==t('recent'))return;const l=document.createElement('div');l.className='lbl';l.textContent=lab;h.appendChild(l);
  if(!arr.length){const n=document.createElement('div');n.className='none';n.textContent=t('empty');h.appendChild(n)}arr.forEach(c=>h.appendChild(histBtn(c)))};
 grp(t('pinned'),list.filter(c=>c.pin));grp(t('recent'),list.filter(c=>!c.pin));
 $('scroll').scrollTop=$('scroll').scrollHeight;
}
function newChat(){if(cur&&!cur.msgs.length){render();return}cur={title:'',msgs:[]};chats.unshift(cur);render()}
function setBusy(v){busy=v;$('send').style.display=v?'none':'grid';$('stop').style.display=v?'grid':'none'}
function answer(q){
 const m={role:'ai',text:'',live:true,think:thinkOn};cur.msgs.push(m);setBusy(true);render();
 const full=reply(q);let n=0;
 setTimeout(()=>{if(!busy)return;timer=setInterval(()=>{n+=3;m.text=full.slice(0,n);
  const el=$('msgs').lastElementChild;if(el)el.querySelector('.body').innerHTML=md(m.text);
  $('scroll').scrollTop=$('scroll').scrollHeight;if(n>=full.length)finish(m)},16)},thinkOn?1800:600);
}
function finish(m){clearInterval(timer);timer=null;m.live=false;if(!m.text)m.text=t('stopped');setBusy(false);render()}
function send(q){q=q.trim();if(!q||busy)return;if(!cur.msgs.length)cur.title=q.slice(0,34);
 cur.msgs.push({role:'user',text:fileName?q+'\n📎 '+fileName:q});setFile('');$('inp').value='';fit();answer(q)}
function regen(i){if(busy)return;let u=i-1;while(u>=0&&cur.msgs[u].role!=='user')u--;if(u<0)return;const q=cur.msgs[u].text.split('\n📎')[0];cur.msgs=cur.msgs.slice(0,u+1);answer(q)}
function fit(){const e=$('inp');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,200)+'px'}
function setFile(n){fileName=n;$('file').classList.toggle('on',!!n);$('fn').textContent='📎 '+n;if(!n)$('fi').value=''}
function closeSide(){$('side').classList.remove('show');$('scrim').classList.remove('show')}
function toggleSide(){const s=$('side');if(innerWidth<=860){s.classList.toggle('show');$('scrim').classList.toggle('show')}else s.classList.toggle('hide')}
$('send').onclick=()=>send($('inp').value);
$('stop').onclick=()=>{const m=cur.msgs[cur.msgs.length-1];if(m&&m.live){if(timer)finish(m);else{m.text=t('stopped');finish(m)}}};
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('inp').value)}});
$('inp').addEventListener('input',fit);
$('newBtn').onclick=()=>{if(busy)return;newChat();closeSide();$('inp').focus()};
$('tog').onclick=toggleSide;$('tog2').onclick=toggleSide;$('scrim').onclick=closeSide;
$('q').oninput=e=>{filter=e.target.value.toLowerCase();render()};
$('plus').onclick=()=>$('fi').click();$('fi').onchange=e=>{if(e.target.files[0])setFile(e.target.files[0].name)};$('fx').onclick=()=>setFile('');
$('think').onclick=()=>{thinkOn=!thinkOn;$('think').classList.toggle('on',thinkOn)};
$('lang').onclick=()=>{L=L==='en'?'bn':'en';applyLang()};
$('theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-soon]'))toast(t('soon'));
 const c=e.target.closest('[data-cc]');
 if(c){const code=c.closest('pre').querySelector('code').textContent;navigator.clipboard&&navigator.clipboard.writeText(code).catch(()=>{});c.lastChild.textContent=t('copied');setTimeout(()=>c.lastChild.textContent=t('copy'),1500)}});
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
cur={title:'',msgs:[]};chats.push(cur);applyLang();
</script>
</body>
